<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0A"/><stop offset="1" stop-color="#111111"/></linearGradient>
    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
      .f1 { animation: up .6s ease-out .2s both; } .f2 { animation: up .6s ease-out .5s both; }
      .f3 { animation: up .6s ease-out .8s both; } .f4 { animation: up .6s ease-out 1.1s both; }
      .f5 { animation: up .6s ease-out 1.4s both; } .f6 { animation: up .6s ease-out 1.7s both; }
      @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="398" rx="18" fill="url(#bg)" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="36" y="30" width="58" height="26" rx="6" fill="#1F1F1F" stroke="#A855F7"/><text x="65" y="48" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#A855F7">GET</text>
  <text x="108" y="49" class="mono" font-size="16" fill="#E6E6E6">/api/sobre-mim</text>
  <circle class="pulse" cx="1050" cy="43" r="5" fill="#A855F7"/><text x="1064" y="48" class="mono" font-size="14" fill="#E6E6E6">200 OK</text>
  <line x1="36" y1="74" x2="1164" y2="74" stroke="#2A2A2A"/>
  <g class="mono" font-size="17">
    <text x="36" y="110" fill="#E6E6E6">{</text>
    <text x="64" y="140" class="mono f1" fill="#8B8B8B">"nome":      <tspan fill="#E6E6E6">"Ryan Moreira"</tspan>,</text>
    <text x="64" y="170" class="mono f2" fill="#8B8B8B">"cargo":     <tspan fill="#E6E6E6">"Dev Full-Stack @ Itpower Software"</tspan>,</text>
    <text x="64" y="200" class="mono f3" fill="#8B8B8B">"atuacao":   <tspan fill="#E6E6E6">"back-end, APIs e bancos de dados · seguros"</tspan>,</text>
    <text x="64" y="230" class="mono f4" fill="#8B8B8B">"formacao":  <tspan fill="#E6E6E6">"Engenharia de Software · Cruzeiro do Sul"</tspan>,</text>
    <text x="64" y="260" class="mono f5" fill="#8B8B8B">"estudando": <tspan fill="#E6E6E6">"IA Generativa com serviços da AWS"</tspan>,</text>
    <text x="64" y="290" class="mono f5" fill="#8B8B8B">"foco":      [<tspan fill="#A855F7">"LLMs"</tspan>, <tspan fill="#A855F7">"agentes de IA"</tspan>],</text>
    <text x="64" y="320" class="mono f6" fill="#8B8B8B">"local":     <tspan fill="#E6E6E6">"Barueri, SP"</tspan>,</text>
    <text x="64" y="350" class="mono f6" fill="#8B8B8B">"aberto_a_colaborar": <tspan fill="#A855F7">true</tspan></text>
    <text x="36" y="380" fill="#E6E6E6">}<tspan class="blink" fill="#A855F7">▌</tspan></text>
  </g>
</svg>
